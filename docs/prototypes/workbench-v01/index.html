<title>工作台 · 产品设计原型 v0.2</title>
<style>
:root{--ink:#183231;--muted:#617472;--line:#dce5e2;--paper:#fff;--bg:#f3f6f4;--accent:#176b60;--soft:#e8f2ee;--amber:#8b5b12;--amberbg:#fff4dc;--red:#a34335;--radius:14px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 "Segoe UI","Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;background:white;border:1px solid var(--line);color:var(--ink);padding:9px 15px;border-radius:8px;font-weight:600}button:hover:not(:disabled){background:#eff5f2;border-color:#9abeb5}button:disabled{cursor:not-allowed;color:#64716f;background:#ecf0ed;opacity:.8}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button.primary:hover:not(:disabled){background:#10574e}button.text{border:0;background:transparent;color:var(--accent);padding:5px 0}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #cc8d32;outline-offset:3px}a{color:var(--accent)}h1,h2,h3,p{margin:0}h1{font-size:30px;line-height:1.4;letter-spacing:-.7px}h2{font-size:19px}h3{font-size:16px}.muted,small{color:var(--muted)}small{font-size:13px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:2px;color:var(--accent);margin-bottom:9px}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:6px;font-size:12px;font-weight:600;background:var(--soft);color:var(--accent);white-space:nowrap}.tag.warn{color:var(--amber);background:var(--amberbg)}.tag.neutral{background:#edf0ef;color:#5c6b68}.tag.danger{color:var(--red);background:#faece8}
.prototype{position:relative;z-index:2;background:#e8eee9;border-bottom:1px solid #cfdad3;padding:9px 24px;display:flex;align-items:center;justify-content:space-between;gap:15px;font-size:12px}.prototype strong{letter-spacing:.8px}.prototype select{font-size:12px;max-width:170px;padding:4px 8px;border:1px solid #b9cdc3;border-radius:5px;background:#fff}.prototype button{font-size:12px;padding:4px 10px}.shell{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:calc(100vh - 51px)}aside{background:#fff;border-right:1px solid var(--line);padding:30px 17px;display:flex;flex-direction:column;gap:26px}.brand{white-space:nowrap;padding:0 12px;display:flex;align-items:center;gap:11px;font-size:21px;font-weight:700}.brand-mark{flex-shrink:0;display:grid;place-items:center;background:var(--ink);color:#fff;width:36px;height:36px;border-radius:10px;font-size:16px}.navgroup{display:grid;gap:5px}.navlabel{font-size:11px;color:#788983;letter-spacing:2px;padding:0 15px 8px}.navgroup button{border:0;background:none;text-align:left;font-weight:400;padding:11px 15px}.navgroup button.active{background:var(--soft);color:var(--accent);font-weight:700}.navgroup button span{display:inline-block;width:25px;font-size:17px}.sidefoot{margin-top:auto;padding:16px 12px 0;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}main{padding:30px 38px 48px;min-width:0}.content{max-width:1200px;margin:auto}.pagehead{margin:0 0 26px}.pagehead p{margin-top:9px;color:var(--muted)}.date{font-size:13px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0}.stat{padding:19px 22px;background:white;border:1px solid var(--line);border-radius:var(--radius);display:flex;align-items:center;justify-content:space-between}.stat strong{font-size:28px;font-weight:600}.stat span{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 292px;gap:22px;align-items:start}.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:18px}.cardhead{padding:20px 22px;border-bottom:1px solid var(--line)}.cardbody{padding:22px}.task{padding:23px 22px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}.task:last-child{border:0}.task p{color:var(--muted);font-size:13px;margin-top:7px}.task .row{margin-bottom:7px}.focus-task{border-left:3px solid var(--accent);background:#fbfdfb}.note{padding:14px 16px;border-radius:8px;background:#f3f6f3;color:var(--muted);font-size:13px}.note.warn{background:var(--amberbg);color:var(--amber)}.next{display:flex;align-items:center;justify-content:space-between;gap:20px;background:#e4efe9;border:1px solid #c6dcd1;border-radius:var(--radius);padding:23px 25px;margin:20px 0 23px}.next p{color:#47685f;font-size:13px;margin-top:5px}.next .eyebrow{margin-bottom:5px}.breadcrumb{font-size:13px;color:var(--muted);margin-bottom:22px}.breadcrumb button{font-size:13px}.steps{display:flex;margin:0 0 22px;padding:0;list-style:none;gap:8px;flex-wrap:wrap}.steps li{font-size:12px;color:var(--muted);padding:6px 11px;border:1px solid var(--line);background:#fff;border-radius:20px}.steps li.complete{background:var(--soft);color:var(--accent);border-color:#c6dcd1}.record{padding:20px 22px;border-bottom:1px solid var(--line)}.record:last-child{border:0}.record .description{margin:12px 0;font-size:14px;color:#50645e;white-space:pre-wrap;overflow-wrap:anywhere}.recordmeta{font-size:12px;color:var(--muted);margin-top:5px}.artifact{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--line);border-radius:9px;background:#fafcfb;margin-top:15px}.artifact small{display:block}.checklist{list-style:none;padding:0;margin:15px 0}.checklist li{display:flex;gap:10px;padding:10px 0;font-size:13px;border-bottom:1px solid #edf1ee}.checklist li:last-child{border:0}.check{width:19px;height:19px;line-height:19px;text-align:center;border-radius:50%;background:var(--soft);color:var(--accent);flex-shrink:0;font-size:12px}.check.pending{background:#f3eee3;color:var(--amber)}.full{width:100%}.stack>*+*{margin-top:12px}.empty{text-align:center;padding:35px 20px}.empty h3{margin-bottom:8px}.footerline{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:12px;color:var(--muted);padding-top:8px}.history{margin-top:14px;font-size:12px;color:var(--muted)}.history summary{cursor:pointer}.history button{font-size:12px}.readonly{margin-bottom:20px}.mobileonly{display:none}
dialog{border:1px solid var(--line);border-radius:16px;padding:0;color:var(--ink);width:min(640px,calc(100vw - 32px));max-height:90vh;box-shadow:0 25px 90px #102e2940}dialog::backdrop{background:#15332b66}.dialoghead{padding:20px 24px;border-bottom:1px solid var(--line)}.dialogbody{padding:24px}.dialogfoot{display:flex;justify-content:flex-end;gap:10px;padding:18px 24px;background:#f7f9f7;border-top:1px solid var(--line)}label.field{display:block;margin-bottom:17px;font-weight:600;font-size:13px}input,textarea{width:100%;border:1px solid #b9cbc2;background:#fff;border-radius:7px;padding:10px 12px;color:var(--ink);margin-top:7px}textarea{resize:vertical;min-height:90px;font-weight:400}input{font-weight:400}.fields2{display:grid;grid-template-columns:1fr 1fr;gap:15px}.error{color:var(--red);font-size:13px;margin-top:12px}.ack{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:18px 0 0}.ack input{width:auto;margin-top:6px}.document{border:1px solid var(--line);padding:24px;background:#fff;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.9;margin:16px 0}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);z-index:10;background:var(--ink);color:white;padding:12px 22px;box-shadow:0 4px 25px #102e2933;border-radius:9px;max-width:90vw;font-size:14px}.toast:empty{display:none}
@media(max-width:1100px){.grid{grid-template-columns:minmax(0,1fr) 250px}main{padding:26px 23px}.shell{grid-template-columns:185px minmax(0,1fr)}}
@media(max-width:900px){.grid{grid-template-columns:1fr}.shell{grid-template-columns:168px minmax(0,1fr)}.stats{gap:8px}.stat{padding:14px}.stat strong{font-size:23px}.next{padding:18px}.task{padding:18px}.prototype{align-items:flex-start}.prototype .row{flex-wrap:wrap}}
@media(max-width:800px){.shell{display:block}aside{padding:14px 15px;gap:15px;border-right:0;border-bottom:1px solid var(--line)}.brand{font-size:18px;padding:0}.brand-mark{width:29px;height:29px;font-size:13px}.navgroup{display:flex;gap:5px;flex-wrap:wrap}.navgroup button{padding:7px 10px;font-size:13px}.navlabel,.secondarynav,.sidefoot{display:none}main{padding:22px 16px}h1{font-size:24px}.prototype{padding:9px 14px;flex-direction:column;gap:7px}.stats{grid-template-columns:repeat(3,1fr)}.stat{display:block}.stat span{display:block;font-size:11px}.stat strong{font-size:24px}.task{grid-template-columns:1fr}.task>button{justify-self:start}.next{align-items:flex-start;flex-direction:column}.date{font-size:11px}.pagehead{margin-bottom:18px}.cardhead,.record,.cardbody{padding:17px}.artifact{align-items:flex-start;flex-direction:column}.fields2{grid-template-columns:1fr;gap:0}.dialogbody{padding:18px}.footerline{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="prototype"><div><strong>DESIGN 0.2 · 设计原型</strong>　示例数据 · 不连接业务系统 · 刷新重置</div><div class="row"><label for="scenario">演示场景</label><select id="scenario"><option value="normal">办理中 · 缺少成果</option><option value="zero">零检查 · 待明确口径</option><option value="reported">已报送 · 可完成</option><option value="done">已完成 · 只读</option></select><button id="reset">重置演示</button></div></div>
<div class="shell"><aside><div class="brand"><div class="brand-mark">工</div>工作台</div><nav class="navgroup" aria-label="业务导航"><div class="navlabel">日常办理</div><button data-nav="home"><span>⌂</span>工作台首页</button><button data-nav="work"><span>▤</span>我的工作台</button><button data-nav="notes"><span>✎</span>工作记录</button><button data-info="文件库"><span>▱</span>文件库</button></nav><nav class="navgroup secondarynav" aria-label="维护导航"><div class="navlabel">规则与支持</div><button data-info="流程规范">流程规范</button><button data-info="知识库">知识库</button><button data-info="AI助手">AI助手</button><button data-info="回收站">回收站</button><button data-info="系统配置">系统配置</button></nav><div class="sidefoot">本地工作台<br>业务办理 · 材料 · 成果<br><br>2026.10 / 设计核对版</div></aside><main id="main"></main></div>
<dialog id="dialog" aria-labelledby="dialog-title"></dialog><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="memory.js"></script>
<script>
'use strict';
const TODAY='2026-10-21';
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state,view='home',serial=0,focusBeforeDialog,dirty=false,toastTimer;
const records=()=>state.records;
const rec=id=>records().find(r=>r.id===Number(id));
const signature=id=>id==='summary'?records().map(r=>`${r.id}:${r.rev}`).join('|'):String(rec(id).rev);
const versions=id=>id==='summary'?state.summary:rec(id).versions;
const latest=id=>versions(id).at(-1);
const current=id=>{const a=latest(id);return a&&a.source===signature(id)?a:null};
const isFinal=id=>current(id)?.status==='final';
const allFinal=()=>records().length>0&&records().every(r=>isFinal(r.id))&&isFinal('summary');
const reportKey=()=>allFinal()?records().map(r=>current(r.id).id).join('|')+'|'+current('summary').id:'';
const reported=()=>Boolean(allFinal()&&state.report?.key===reportKey());
function createArtifact(id,status='draft'){
 const content=id==='summary'?`2026年10月监督检查汇总（示例）\n\n登记检查记录：${records().length}条。\n\n`+records().map(r=>`${r.date}｜${r.project}\n事项：${r.subject}\n内容：${r.content}\n结果：${r.result}`).join('\n\n'):`监督检查记录（示例）\n\n检查日期：${rec(id).date}\n项目：${rec(id).project}\n事项：${rec(id).subject}\n检查内容：${rec(id).content}\n检查结果：${rec(id).result}`;
 const a={id:++serial,version:versions(id).length+1,source:signature(id),status,content};versions(id).push(a);return a;
}
function reset(s='normal'){
 state={done:false,report:null,summary:[],records:s==='zero'?[]:[{id:1,rev:1,date:'2026-10-08',project:'甲项目',subject:'采购事项资料检查',content:'核对本次采购资料的登记与留存情况。',result:'已核对本次登记资料，发现1项附件待补充。',versions:[]},{id:2,rev:1,date:'2026-10-18',project:'乙项目',subject:'合同履约资料检查',content:'检查本次履约材料的留存和对应关系。',result:'本次所列材料已核对；不代表项目全部事项已完成。',versions:[]}]};
 if(s!=='zero')createArtifact(1,'final');
 if(s==='reported'||s==='done'){createArtifact(2,'final');createArtifact('summary','final');state.report={date:'2026-10-20',key:reportKey()};state.done=s==='done'}render();
}
function toast(message){$('#toast').textContent=message;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').textContent='',4500)}
function go(v){view=v;render();window.scrollTo(0,0)}
function next(){
 if(state.done)return{title:'本期已完成',reason:'10月已结束办理。其他期次和整个周期工作保持独立。',label:'返回工作台首页',action:'home'};
 if(!records().length)return{title:'尚无检查记录',reason:'零检查月份的办结口径待明确；如已开展检查，可登记实际情况。',label:'登记检查',action:'add'};
 const r=records().find(r=>!isFinal(r.id));
 if(r)return{title:current(r.id)?`核对${r.project}的检查成果`:`起草${r.project}的检查成果`,reason:latest(r.id)&&!current(r.id)?'检查记录已修改，旧稿需要重新核对。':'每次检查分别留存成果，再核对本期汇总。',label:current(r.id)?'查看示例稿':'起草示例稿',action:current(r.id)?'review':'draft',id:r.id};
 if(!isFinal('summary'))return{title:current('summary')?'核对本期汇总':'整理本期汇总',reason:'将本月独立记录汇总，核对范围和内容后再定稿。',label:current('summary')?'查看示例汇总':'起草示例汇总',action:current('summary')?'review':'draft',id:'summary'};
 if(!reported())return{title:state.report?'重新核对实际报送':'确认本期实际报送',reason:state.report?'成果已变化，原报送确认不能覆盖当前版本。':'成果已齐备。记录实际发生的报送，不会自动发送。',label:'确认报送情况',action:'report'};
 return{title:'本期已具备完成条件',reason:'检查成果、本期汇总及对应报送均已核对。',label:'完成本期',action:'complete'};
}
const actionButton=(n,cls='primary')=>`<button class="${cls}" data-action="${n.action}"${n.id!==undefined?` data-id="${n.id}"`:''}>${esc(n.label)}</button>`;
function stats(){return `<div class="stats"><div class="stat"><span>待处理 · 示例</span><strong>${state.done?2:3}</strong></div><div class="stat"><span>其中今日截止</span><strong>1</strong></div><div class="stat"><span>等待外部资料</span><strong>1</strong></div></div>`}
function home(){const n=next();return `<div class="pagehead"><div class="row between wrap"><div class="eyebrow">YOUR WORK, IN ORDER</div><div class="date">演示时点 · 2026年10月21日　星期三</div></div><h1>${view==='work'?'我的工作台':'把今天的工作，一件件办清楚。'}</h1><p>${view==='work'?'示例工作清单。类型分类沿用信息化项目、工程项目、行政管理。':'从待处理事项进入，直接看到缺项和下一步。'}</p></div>${view==='home'?noteComposer():''}${stats()}<div class="grid"><div><section class="card"><div class="cardhead row between wrap"><h2>${view==='work'?'示例工作':'需要处理'}</h2><span class="muted">按截止与办理状态排列</span></div><article class="task"><div><div class="row wrap"><span class="tag warn">今日截止</span><small>项目实施 / 测试与交付</small></div><h3>示例软件项目 · 交付材料核对</h3><p>测试报告待补齐 · 示例截止 10月21日</p></div><button data-info="项目办理">查看办理设计</button></article>${!state.done||view==='work'?`<article class="task focus-task"><div><div class="row wrap"><span class="tag ${state.done?'':'warn'}">${state.done?'本期已完成':'可继续办理'}</span><small>清廉监督 / 2026年10月</small></div><h3>月度监督检查与报送</h3><p>${esc(n.title)} · 示例截止 10月25日</p></div><button class="primary" data-action="monthly">${state.done?'查看本期':'进入本期办理'} →</button></article>`:''}<article class="task"><div><div class="row wrap"><span class="tag neutral">等待资料</span><small>部门工时 / 2026年10月</small></div><h3>部门工时 · 核算准备</h3><p>待取得本月完整考勤资料 · 示例截止 11月3日</p></div><button data-info="工时办理">查看办理设计</button></article></section>${state.done&&view==='home'?'<div class="note">10月月检已从待处理事项移出。<button class="text" data-action="monthly">查看已完成本期 →</button></div>':''}</div><div><section class="card"><div class="cardbody stack"><div class="eyebrow">办理原则</div><h2>知道缺什么，<br>再决定下一步。</h2><p class="muted">每项工作独立显示期次、成果和缺项。完成一份文件之后，还要核对实际业务是否办结。</p><div class="note">本轮可交互：一句话工作记录及月度检查完整演示链路。项目、工时及支持入口展示设计说明。</div></div></section><section class="card"><div class="cardbody stack"><h3>业务设计基线</h3><p class="muted">五条业务线 · 六类代表场景<br>保留现有三个工作类型目录</p><a href="../../36-工作台产品设计方案-2026-10-21.md">阅读完整设计方案 ↗</a></div></section></div></div>`}
function artifactRow(id){const a=latest(id),c=current(id),title=id==='summary'?'10月监督检查汇总':'本次检查成果',r=id==='summary'?null:rec(id);return `<div class="artifact"><div><strong>${title}</strong><small>${!a?'尚未起草':!c?`来源已变化 · 旧稿 v${a.version}`:`${a.status==='final'?'已定稿':'草稿待核对'} · v${a.version}`}</small></div>${state.done?`<button data-action="review" data-id="${id}">查看${r?esc(r.project):'汇总'}成果</button>`:actionButton({action:c?'review':'draft',id,label:c?`查看${r? r.project:'汇总'}示例稿`:`起草${r?r.project:'汇总'}示例稿`},'')}${a&&!c?`<button class="text" data-action="review" data-id="${id}">查看旧稿</button>`:''}</div>${versions(id).length>1?`<details class="history"><summary>历史版本（${versions(id).length-1}）</summary>${versions(id).slice(0,-1).map(v=>`<div><button class="text" data-action="history" data-id="${id}" data-version="${v.id}">v${v.version} · ${v.status==='final'?'历史定稿':'历史草稿'} · 查看</button></div>`).join('')}</details>`:''}`}
function recordCard(r,index){return `<article class="record"><div class="row between wrap"><div><div class="row wrap"><h3>${String(index+1).padStart(2,'0')}　${esc(r.project)}</h3><span class="tag ${isFinal(r.id)?'':'warn'}">${isFinal(r.id)?'成果已定稿':latest(r.id)&&!current(r.id)?'来源已变化':'待核对成果'}</span></div><div class="recordmeta">${r.date} · ${esc(r.subject)}</div></div>${!state.done?`<button class="text" data-action="edit" data-id="${r.id}">编辑${esc(r.project)}记录</button>`:''}</div><p class="description">${esc(r.content)}<br>检查结果：${esc(r.result)}</p>${artifactRow(r.id)}</article>`}
function checks(){return [{ok:records().length>0,label:`检查记录已登记（${records().length}条）`},{ok:records().length>0&&records().every(r=>isFinal(r.id)),label:'各次必备成果已核对定稿'},{ok:isFinal('summary'),label:'本期汇总已核对定稿'},{ok:reported(),label:'已确认对应版本的实际报送'}]}
function monthly(){const n=next(),cs=checks(),count=cs.filter(c=>c.ok).length;return `<div class="breadcrumb"><button class="text" data-action="home">工作台首页</button>　/　清廉监督　/　2026年10月</div><div class="pagehead"><div class="row between wrap"><div><div class="eyebrow">MONTHLY INSPECTION</div><h1>月度监督检查与报送</h1></div><span class="tag ${state.done?'':'warn'}">${state.done?'本期已完成':'本期办理中'}</span></div><p>2026年10月　·　示例截止 10月25日　·　${records().length}条独立检查记录</p></div>${state.done?'<div class="note readonly">本期已完成，内容只读。若需修正，先重新打开；后续内容修改需要重新核对成果与报送。</div>':''}<div class="next"><div><div class="eyebrow">下一步</div><h2>${esc(n.title)}</h2><p>${esc(n.reason)}</p></div>${actionButton(n)}</div><ol class="steps">${['登记检查','各次成果','本期汇总','实际报送'].map((s,i)=>`<li class="${cs[i].ok?'complete':''}">${cs[i].ok?'✓':i+1} ${s}</li>`).join('')}<li class="${state.done?'complete':''}">${state.done?'✓':'5'} 完成本期</li></ol><div class="grid"><div><section class="card"><div class="cardhead row between wrap"><h2>检查记录 <small>每次独立留存</small></h2>${!state.done?'<button data-action="add">＋ 登记检查</button>':''}</div>${records().length?records().map(recordCard).join(''):'<div class="empty"><h3>本月尚无检查记录</h3><p class="muted">如尚未开展检查，请保留当前状态。<br>零检查月的办结规则需要另行明确。</p></div>'}</section><section class="card"><div class="cardhead"><h2>本期汇总</h2><small>范围：2026年10月登记的检查记录，不代表年度累计</small></div><div class="cardbody">${records().length?artifactRow('summary'):'<p class="muted">登记实际检查后，再整理本期汇总。</p>'}</div></section><section class="card"><div class="cardhead row between wrap"><h2>实际报送</h2><span class="tag ${reported()?'':'warn'}">${reported()?'已确认':state.report?'需重新确认':'尚未确认'}</span></div><div class="cardbody stack"><p>${reported()?`示例报送日期：${state.report.date}。已对应当前成果。`:state.report?`原示例报送日期：${state.report.date}。成果已变化，原确认不能覆盖新版本。`:'在必备成果核对后，记录实际发生的报送日期。'}</p>${!state.done?`<button data-action="report" ${!allFinal()?'disabled':''}>${state.report?'重新确认报送情况':'确认报送情况'}</button>`:''}${!allFinal()?'<p class="muted">尚有成果未核对，暂不能确认报送。</p>':''}<small>本操作只记录事实，不会自动发送材料。</small></div></section></div><div><section class="card"><div class="cardbody"><div class="row between"><h2>完成核对</h2><strong>${count}/4</strong></div><ul class="checklist">${cs.map(c=>`<li><span class="check ${c.ok?'':'pending'}">${c.ok?'✓':'·'}</span>${c.label}</li>`).join('')}</ul>${state.done?'<button class="full" data-action="reopen">重新打开本期</button>':`<button class="primary full" data-action="complete" ${!reported()?'disabled':''}>完成本期</button>`}<p class="muted" style="font-size:12px;margin-top:12px">${state.done?'如需修正本期内容，请先重新打开。':reported()?'条件已齐备，可完成本期。':'请先处理未满足项，再完成本期。'}<br>完成本期不会结束整个周期工作。</p></div></section><div class="note">示例成果仅展示核对交互。真实必备模板、材料与文件可读性须在实际实现中验证。</div></div></div><div class="footerline"><span>记录、成果、报送与完成分别核对</span><button class="text" data-info="设计范围">查看本轮设计范围</button></div>`}
function render(){ const focused=document.activeElement,restore=focused?.closest('#main')?{action:focused.dataset.action,id:focused.dataset.id}:null; $('#main').innerHTML=`<div class="content">${view==='monthly'?monthly():view==='notes'?notesPage():home()}</div>`;document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===(view==='monthly'?'work':view)));if(restore){const target=Array.from(document.querySelectorAll('#main button')).find(b=>b.dataset.action===restore.action&&b.dataset.id===restore.id&&!b.disabled)||document.querySelector('#main .next button')||document.querySelector('#main h1');if(target){if(target.tagName==='H1')target.tabIndex=-1;target.focus({preventScroll:true})}}}
function showDialog(title,body,footer){focusBeforeDialog=document.activeElement;dirty=false;$('#dialog').innerHTML=`<form id="dialog-form"><div class="dialoghead"><h2 id="dialog-title">${title}</h2></div><div class="dialogbody">${body}<p id="dialog-error" class="error" role="alert"></p></div><div class="dialogfoot"><button type="button" data-close>取消</button>${footer||''}</div></form>`;$('#dialog').showModal();$('#dialog-form').oninput=()=>dirty=true}
function closeDialog(){ $('#dialog').close();dirty=false;if(focusBeforeDialog?.isConnected)focusBeforeDialog.focus()}
function requestClose(){if(!dirty||window.confirm('尚有未保存的输入，确认放弃本次修改？'))closeDialog()}
function fail(msg){$('#dialog-error').textContent=msg}
function editRecord(id){if(state.done)return;const r=id?rec(id):null;showDialog(r?`编辑${esc(r.project)}检查记录`:'登记本次检查',`<p class="note" style="margin-bottom:20px">填写实际发生的检查。这里为内存演示，不保存到正式工作。</p><div class="fields2"><label class="field">检查日期（必填）<input name="date" type="date" min="2026-10-01" max="${TODAY}" value="${r?.date||TODAY}" required></label><label class="field">项目（必填）<input name="project" maxlength="80" value="${esc(r?.project||'')}" required></label></div><label class="field">检查事项（必填）<input name="subject" maxlength="160" value="${esc(r?.subject||'')}" required></label><label class="field">检查内容（必填）<textarea name="content" maxlength="2000" required>${esc(r?.content||'')}</textarea></label><label class="field">检查结果（必填）<textarea name="result" maxlength="2000" required>${esc(r?.result||'')}</textarea></label>${r?'<small>修改会使本条对应成果和本期汇总需要重新核对，原报送确认可能不再有效。</small>':''}`,'<button type="submit" class="primary">保存示例记录</button>');$('#dialog-form').onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));for(const key of Object.keys(data))data[key]=data[key].trim();if(Object.values(data).some(v=>!v))return fail('请填写所有必填项，不能只输入空格。');if(data.date<'2026-10-01'||data.date>TODAY)return fail('请选择本期内且不晚于演示日期的检查日。');if(r){const changed=Object.keys(data).some(k=>r[k]!==data[k]);if(changed){Object.assign(r,data);r.rev++}}else{records().push({...data,id:Math.max(0,...records().map(r=>r.id))+1,rev:1,versions:[]})}closeDialog();render();toast('示例记录已保存；请核对成果与报送状态。')}}
function review(id,versionId){const a=versionId?versions(id).find(v=>v.id===Number(versionId)):latest(id);if(!a)return;const valid=current(id)?.id===a.id;const canFinalize=valid&&a.status==='draft'&&!state.done;showDialog(`${id==='summary'?'本期汇总':'检查成果'} · v${a.version}`,`<div class="note">这是按示例记录排版的文本，不是真实Word或AI生成结果。</div><div class="document">${esc(a.content)}</div><p class="muted">状态：${!valid?'历史版本／来源已变化，不可直接定稿':a.status==='final'?'已模拟定稿':'草稿，待核对'}</p>${canFinalize?'<label class="ack"><input id="review-ack" type="checkbox" required>我已核对示例稿与对应记录一致。</label>':''}`,canFinalize?'<button type="submit" class="primary">模拟定稿</button>':'<button type="button" data-close>关闭查看</button>');$('#dialog-form').onsubmit=e=>{e.preventDefault();if(!canFinalize||!$('#review-ack').checked)return;if(current(id)?.id!==a.id||state.done)return fail('来源或状态已变化，请重新打开核对。');a.status='final';closeDialog();render();toast('已模拟定稿；请继续处理下一步。')}}
function report(){if(!allFinal()||state.done)return;showDialog('确认实际报送情况',`<div class="note">模拟操作：不发送材料，也不记录真实业务报送。</div><label class="field" style="margin-top:20px">实际报送日期（必填）<input type="date" name="date" value="${TODAY}" max="${TODAY}" required></label><label class="ack"><input name="ack" type="checkbox" required>我已核对示例日期和当前成果，确认本次为演示。</label>`,'<button type="submit" class="primary">模拟确认报送</button>');$('#dialog-form').onsubmit=e=>{e.preventDefault();const date=new FormData(e.target).get('date');if(!date||date>TODAY)return fail('报送日期不能在演示时点之后。');if(!allFinal())return fail('成果已变化，请先核对。');state.report={date,key:reportKey()};closeDialog();render();toast('已模拟确认报送，现在可完成本期。')}}
function complete(){if(!reported()||state.done)return;showDialog('完成2026年10月月检',`<p>本期示例检查记录、成果、汇总及对应报送均已核对。</p><p style="margin-top:12px">完成后本期只读；其他期次及整个周期工作保持独立。</p>`,'<button type="submit" class="primary">确认完成本期</button>');$('#dialog-form').onsubmit=e=>{e.preventDefault();if(!reported())return fail('条件已变化，请重新核对。');state.done=true;closeDialog();render();toast('10月示例期次已完成，首页待处理事项已同步。')}}
function info(name){const texts={'项目办理':'阶段总览 → 办理适用阶段 → 核对材料与证明 → 结束业务／整理档案。保留软件、集成、通用信息化、工程和服务各自的阶段。历史项目突出资料补录，不重演历史。','工时办理':'选定月份 → 导入同月资料 → 人员项目匹配 → 计算与异常处理 → 逐日及汇总对账 → 最新运行定稿导出。缺少考勤不能猜补；旧定稿不能替代最新未通过的计算。','文件库':'按工作、期次或阶段定位文件，显示版本、定稿与来源是否变化，并可回到所属工作。','流程规范':'沿用信息化项目、工程项目、行政管理三个目录；通用单次工作的新建办理改为轻量工作记录，旧类型与历史资料保留。规则修改需说明对新工作和已有快照的影响。','知识库':'模板、制度与参考资料继续提供共用支持。正式依据和草稿材料分别标识。','AI助手':'在明确业务范围内提供检索与起草；来源、缺失及冲突可见，不代替事实确认、工时计算或正式报送。','回收站':'保留恢复入口。删除一致性风险仍待隔离复核，本次原型不模拟正式删除或清空。','系统配置':'维护本地配置与备份等能力；发布版本、数据目录和恢复范围需要清楚可查。','设计范围':'本轮可交互的是首页、工作记录及月检链路。其他页面只有设计说明。所有日期、对象与成果均为虚构示例，刷新页面即重置。'};showDialog(`${esc(name)} · 设计说明`,`<p>${esc(texts[name])}</p><div class="note" style="margin-top:20px">这一入口尚未制作业务交互；完整方案见产品设计文档第3至9节。</div>`,'<button type="button" data-close>知道了</button>');$('#dialog-form').onsubmit=e=>e.preventDefault()}
function action(a,id){if(a==='monthly')return go('monthly');if(a==='home')return go('home');if(a==='add')return editRecord();if(a==='edit')return editRecord(id);if(a==='review')return review(id);if(a==='draft'){if(state.done||!records().length)return;createArtifact(id);render();return toast('示例草稿已准备，请查看内容并核对。')}if(a==='report')return report();if(a==='complete')return complete();if(a==='reopen'){showDialog('重新打开2026年10月月检','<p>本期将恢复可编辑。已有成果和报送记录保留；修改检查内容后，相关成果与报送需要重新核对。</p>','<button type="submit" class="primary">确认重新打开</button>');$('#dialog-form').onsubmit=e=>{e.preventDefault();state.done=false;closeDialog();render();toast('本期已重新打开。')}}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.hasAttribute('data-close'))return requestClose();if(b.dataset.nav)return go(b.dataset.nav);if(b.dataset.info)return info(b.dataset.info);if(b.dataset.action==='history')return review(b.dataset.id,b.dataset.version);if(b.dataset.action)return action(b.dataset.action,b.dataset.id)});
$('#dialog').addEventListener('cancel',e=>{e.preventDefault();requestClose()});
$('#scenario').onchange=e=>{reset(e.target.value);toast('已切换示例场景。')};$('#reset').onclick=()=>{resetNotes();reset($('#scenario').value);toast('演示已重置。')};reset();
</script>
</body>
</html>
